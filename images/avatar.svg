<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" filter="url(#glow)" opacity="0.8"/>
  <circle cx="100" cy="100" r="86" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

  <!-- Developer Silhouette / Face -->
  <circle cx="100" cy="78" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M46 160 C46 130 68 120 100 120 C132 120 154 130 154 160" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- Code Symbol Overlay -->
  <circle cx="100" cy="78" r="22" fill="#0ea5e9" opacity="0.2"/>
  <path d="M92 73 L84 78 L92 83" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M108 73 L116 78 L108 83" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M102 70 L98 86" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Floating Tech Badge -->
  <circle cx="152" cy="148" r="18" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
  <text x="152" y="153" font-size="12" font-family="system-ui, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
</svg>
