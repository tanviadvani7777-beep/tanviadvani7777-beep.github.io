<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="100%" stop-color="#0f1f45"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#aiBg)"/>

  <!-- Futuristic Grid Lines -->
  <line x1="0" y1="140" x2="320" y2="140" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
  <line x1="0" y1="155" x2="320" y2="155" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>
  <line x1="0" y1="168" x2="320" y2="168" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>

  <!-- Glowing Central Voice AI Hologram Orb -->
  <circle cx="160" cy="75" r="48" fill="url(#orbGlow)"/>
  <circle cx="160" cy="75" r="32" fill="#070d1e" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="160" cy="75" r="22" fill="#0e1a38" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Mic / Sound Wave Icon inside Orb -->
  <g transform="translate(150, 65)">
    <rect x="7" y="2" width="6" height="11" rx="3" fill="#38bdf8"/>
    <path d="M4 8 C4 13 16 13 16 8" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <line x1="10" y1="13" x2="10" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="17" x2="13" y2="17" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Animated Sound Wave Lines -->
  <g transform="translate(30, 85)">
    <line x1="20" y1="0" x2="20" y2="0" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="-8" x2="32" y2="8" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="-18" x2="44" y2="18" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="-10" x2="56" y2="10" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="68" y1="-26" x2="68" y2="26" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="-14" x2="80" y2="14" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right side soundwave -->
    <line x1="180" y1="-14" x2="180" y2="14" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="192" y1="-26" x2="192" y2="26" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="204" y1="-10" x2="204" y2="10" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="216" y1="-18" x2="216" y2="18" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="228" y1="-8" x2="228" y2="8" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="0" x2="240" y2="0" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Gemini AI Sparkle / Star Badge -->
  <g transform="translate(260, 20)">
    <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0" fill="#38bdf8"/>
    <circle cx="12" cy="12" r="3" fill="#ffffff"/>
  </g>

  <!-- Tech Pill Tag -->
  <rect x="85" y="142" width="150" height="22" rx="11" fill="rgba(14, 165, 233, 0.2)" stroke="#38bdf8" stroke-width="1"/>
  <text x="160" y="157" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#7dd3fc" text-anchor="middle" font-weight="600">MERN Stack • Gemini AI</text>
</svg>
