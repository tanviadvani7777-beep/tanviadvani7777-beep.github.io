<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fashionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="50%" stop-color="#0a1636"/>
      <stop offset="100%" stop-color="#141b3d"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic/Cyan Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f234f"/>
      <stop offset="100%" stop-color="#07132c"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="180" fill="url(#fashionBg)"/>

  <!-- Subtle Perspective Floor Grid -->
  <line x1="0" y1="135" x2="320" y2="135" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1"/>
  <line x1="0" y1="152" x2="320" y2="152" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
  <line x1="0" y1="168" x2="320" y2="168" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="72" r="65" fill="url(#cyanGlow)"/>
  <circle cx="70" cy="60" r="45" fill="url(#purpleGlow)"/>
  <circle cx="250" cy="65" r="45" fill="url(#cyanGlow)"/>

  <!-- Left Floating Mini Card: Product Showcase (Lookbook) -->
  <g transform="translate(32, 38)">
    <rect width="78" height="82" rx="8" fill="#09142e" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <!-- Hanger Icon -->
    <path d="M 39 16 C 36 13 42 10 39 8 C 36 6 34 9 37 12 L 39 16 L 16 30 L 62 30 Z" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="16" y1="30" x2="62" y2="30" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- T-Shirt Outline silhouette -->
    <path d="M 27 30 L 22 36 L 26 40 L 29 37 L 29 54 L 49 54 L 49 37 L 52 40 L 56 36 L 51 30 Z" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.2"/>
    <!-- Price badge -->
    <rect x="18" y="62" width="42" height="12" rx="6" fill="rgba(14, 165, 233, 0.2)"/>
    <text x="39" y="71" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#7dd3fc" text-anchor="middle" font-weight="600">₹1,499</text>
  </g>

  <!-- Right Floating Mini Card: Payment & Cart (Razorpay / Redux) -->
  <g transform="translate(210, 36)">
    <rect width="80" height="84" rx="8" fill="#09142e" stroke="rgba(129, 140, 248, 0.28)" stroke-width="1"/>
    <!-- Cart Icon with badge -->
    <circle cx="28" cy="24" r="10" fill="rgba(56, 189, 248, 0.15)"/>
    <path d="M 23 20 L 25 20 L 27 27 L 33 27 L 34 22 L 26 22" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27.5" cy="29" r="1" fill="#38bdf8"/>
    <circle cx="32.5" cy="29" r="1" fill="#38bdf8"/>
    <!-- Cart Items Count Badge -->
    <circle cx="34" cy="18" r="4.5" fill="#f43f5e"/>
    <text x="34" y="20.5" font-family="'Segoe UI', sans-serif" font-size="6.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
    <!-- Razorpay Badge -->
    <rect x="14" y="38" width="52" height="15" rx="4" fill="rgba(2, 132, 199, 0.2)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
    <text x="40" y="49" font-family="'Segoe UI', sans-serif" font-size="7.5" fill="#38bdf8" text-anchor="middle" font-weight="700">RAZORPAY ✓</text>
    <!-- Order Status Pill -->
    <rect x="14" y="59" width="52" height="14" rx="4" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="0.8"/>
    <circle cx="22" cy="66" r="2.5" fill="#22c55e"/>
    <text x="43" y="69.5" font-family="'Segoe UI', sans-serif" font-size="6.8" fill="#4ade80" text-anchor="middle" font-weight="600">PAID &amp; CONFIRMED</text>
  </g>

  <!-- Center Hero Element: Luxury Fashion Shopping Bag & Fusion Monogram -->
  <g transform="translate(125, 22)">
    <!-- Bag Handles -->
    <path d="M 22 28 C 22 10 48 10 48 28" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <polygon points="12,28 58,28 66,88 4,88" fill="url(#bagGrad)" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Bag Front Fold Shadows -->
    <polygon points="12,28 35,88 4,88" fill="rgba(0, 0, 0, 0.2)"/>
    <polygon points="58,28 66,88 35,88" fill="rgba(255, 255, 255, 0.04)"/>

    <!-- "FF" The Fashion Fusion Monogram -->
    <circle cx="35" cy="54" r="16" fill="#07122b" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <text x="35" y="59" font-family="'Cinzel', 'Playfair Display', serif, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="800" letter-spacing="1">FF</text>

    <!-- Star / Sparkle Accents on Bag -->
    <path d="M 52 38 Q 52 43 57 43 Q 52 43 52 48 Q 52 43 47 43 Q 52 43 52 38" fill="#38bdf8"/>
    <circle cx="16" cy="46" r="1.5" fill="#818cf8"/>
  </g>

  <!-- Top Floating Fashion Sparkles -->
  <g transform="translate(282, 14)">
    <path d="M 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Q 8 8 8 0" fill="#38bdf8"/>
    <circle cx="8" cy="8" r="2" fill="#ffffff"/>
  </g>
  <g transform="translate(18, 16)">
    <path d="M 6 0 Q 6 6 12 6 Q 6 6 6 12 Q 6 6 0 6 Q 6 6 6 0" fill="#818cf8"/>
  </g>

  <!-- Bottom Technology Pill Banner -->
  <rect x="55" y="142" width="210" height="23" rx="11.5" fill="rgba(7, 13, 30, 0.85)" stroke="#38bdf8" stroke-width="1.1"/>
  <text x="160" y="157.5" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7dd3fc" text-anchor="middle" font-weight="600">MERN Stack • Redux Toolkit • Razorpay</text>
</svg>
