<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081024"/>
      <stop offset="100%" stop-color="#0c1833"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bgT)"/>

  <!-- Desktop Window Frame Outline -->
  <rect x="60" y="15" width="200" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="60" y="15" width="200" height="26" rx="10" fill="#1e293b"/>
  <!-- Window buttons -->
  <circle cx="75" cy="28" r="4" fill="#ef4444"/>
  <circle cx="88" cy="28" r="4" fill="#f59e0b"/>
  <circle cx="101" cy="28" r="4" fill="#10b981"/>
  <text x="160" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">Tic-Tac-Toe Python Tkinter</text>

  <!-- Game Board Grid -->
  <g transform="translate(105, 55)">
    <line x1="36" y1="0" x2="36" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="74" y1="0" x2="74" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="33" x2="110" y2="33" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="67" x2="110" y2="67" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- X and O Marks -->
    <text x="18" y="25" font-family="'JetBrains Mono', monospace" font-size="24" fill="#38bdf8" font-weight="800" text-anchor="middle">X</text>
    <text x="55" y="25" font-family="'JetBrains Mono', monospace" font-size="24" fill="#f43f5e" font-weight="800" text-anchor="middle">O</text>
    <text x="92" y="25" font-family="'JetBrains Mono', monospace" font-size="24" fill="#38bdf8" font-weight="800" text-anchor="middle">X</text>

    <text x="18" y="58" font-family="'JetBrains Mono', monospace" font-size="24" fill="#94a3b8" font-weight="800" text-anchor="middle"></text>
    <text x="55" y="58" font-family="'JetBrains Mono', monospace" font-size="24" fill="#38bdf8" font-weight="800" text-anchor="middle">X</text>
    <text x="92" y="58" font-family="'JetBrains Mono', monospace" font-size="24" fill="#f43f5e" font-weight="800" text-anchor="middle">O</text>

    <text x="18" y="92" font-family="'JetBrains Mono', monospace" font-size="24" fill="#f43f5e" font-weight="800" text-anchor="middle">O</text>
    <text x="55" y="92" font-family="'JetBrains Mono', monospace" font-size="24" fill="#94a3b8" font-weight="800" text-anchor="middle"></text>
    <text x="92" y="92" font-family="'JetBrains Mono', monospace" font-size="24" fill="#38bdf8" font-weight="800" text-anchor="middle">X</text>

    <!-- Diagonal Winning Line -->
    <line x1="5" y1="5" x2="105" y2="95" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 2"/>
  </g>
</svg>
