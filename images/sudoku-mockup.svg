<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081024"/>
      <stop offset="100%" stop-color="#0d1b38"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bgS)"/>
  
  <!-- Mobile Phone Frame Outline -->
  <rect x="90" y="10" width="140" height="160" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="135" y="16" width="50" height="5" rx="2.5" fill="#334155"/>
  
  <!-- Sudoku Grid (3x3 outer blocks) -->
  <g transform="translate(100, 32)">
    <rect width="120" height="120" rx="6" fill="#070d1e" stroke="#0ea5e9" stroke-width="1.5"/>
    
    <!-- Subgrid divider lines -->
    <line x1="40" y1="0" x2="40" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Minor grid lines -->
    <line x1="13.3" y1="0" x2="13.3" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="26.6" y1="0" x2="26.6" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="53.3" y1="0" x2="53.3" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="66.6" y1="0" x2="66.6" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="93.3" y1="0" x2="93.3" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="106.6" y1="0" x2="106.6" y2="120" stroke="#1e293b" stroke-width="0.8"/>
    
    <line x1="0" y1="13.3" x2="120" y2="13.3" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="26.6" x2="120" y2="26.6" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="53.3" x2="120" y2="53.3" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="66.6" x2="120" y2="66.6" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="93.3" x2="120" y2="93.3" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="0" y1="106.6" x2="120" y2="106.6" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Numbers in Sudoku -->
    <text x="7" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">5</text>
    <text x="20" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">3</text>
    <text x="60" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">7</text>
    <text x="7" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">6</text>
    <text x="47" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">1</text>
    <text x="60" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">9</text>
    <text x="74" y="23" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">5</text>
    <text x="20" y="37" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">9</text>
    <text x="33" y="37" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">8</text>
    <text x="100" y="37" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" font-weight="bold">6</text>

    <!-- Active cell highlight -->
    <rect x="40" y="40" width="13.3" height="13.3" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="1"/>
    <text x="47" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff" font-weight="bold">4</text>
  </g>
  
  <!-- Floating Tag -->
  <rect x="15" y="135" width="60" height="22" rx="6" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="45" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle" font-weight="600">Java / XML</text>
</svg>
